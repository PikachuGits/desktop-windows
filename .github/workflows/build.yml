# Windows + macOS 双端打包（Tauri 2）
# 触发：tag v*、推 main、PR、手动
# 产物不含 open-local-link.config.json（真实配置勿入库）

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 确认不会打入本地配置
        shell: bash
        run: |
          if [ -f open-local-link.config.json ]; then
            echo "发现 open-local-link.config.json，已移除（真实配置不得打包）" >&2
            rm -f open-local-link.config.json
          fi
          test -f open-local-link.config.example.json

      - name: 构建安装包
        run: npm run tauri build

      - name: 列出产物
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f | tee bundle-list-${{ matrix.platform }}.txt
          ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/msi 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/dmg 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/macos 2>/dev/null || true

      - name: 上传 ${{ matrix.platform }} 安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/*
          if-no-files-found: error

      - name: 发布 Release（仅 tag，双端合并）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/macos/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
