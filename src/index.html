<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>打开本地链接服务</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 对齐 Form1.Designer：ClientSize 1276×661，左控件 + 右 webBrowser1 -->
  <div id="form">
    <span class="lbl" id="label1">本机密钥：</span>
    <span class="boxed" id="keylabel">这里显示KEY</span>
    <span class="muted" id="infolabel">单击复制到粘贴板</span>
    <button id="keybutton" type="button">点击复制</button>

    <span class="lbl" id="label4">连接状态：</span>
    <button id="zhuchebutton" type="button">点击注册(未注册)</button>

    <span class="lbl" id="label2">注册人：</span>
    <span class="boxed" id="namelabel"></span>

    <button id="button1" type="button">清空日志</button>
    <button id="button2" type="button">退出程序</button>
    <span class="muted small" id="label3">右侧5秒自动刷新&gt;&gt;</span>

    <textarea id="infotextBox" readonly spellcheck="false"></textarea>

    <!-- webBrowser1：内嵌 PC 列表真实页（由 app.js 拉取后注入，并挂钩 #iprdp） -->
    <iframe id="webBrowser1" title="内嵌网页" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="web-fallback" class="hidden">无法加载主机列表页面，请检查配置中的地址是否可达。</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
